[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-keep-awake"
version = "0.1.0"
description = "Keep a Windows laptop awake while Claude Code is working, and let it sleep and lock as normal otherwise."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "win-background>=0.3",   # power requests, the scheduled task, the lock, notifications and the log; not on PyPI, see README
]

[project.scripts]
claude-keep-awake = "claude_keep_awake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
