name: release

# Push a tag such as v1.0.0 or v1.0.0-rc.1. A tag with a hyphen becomes a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the release
  id-token: write        # sign the provenance attestation
  attestations: write

# WinBackground comes from background-tools-lib, checked out beside this repo as the build expects (see build.yml).
env:
  BACKGROUND_TOOLS_LIB_REF: 987af97616f1718cc35bdddaedb6433b40e71c06   # pinned: a release builds against one known library commit; bump deliberately

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-keep-awake
    steps:
      - uses: actions/checkout@v5
        with:
          path: ai-keep-awake

      - uses: actions/checkout@v5
        with:
          repository: gareth-jones-zen/background-tools-lib
          ref: ${{ env.BACKGROUND_TOOLS_LIB_REF }}
          path: background-tools-lib

      - name: Library commit
        shell: pwsh
        run: git -C ../background-tools-lib log -1 --format='background-tools-lib %H %s'

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ai-keep-awake/global.json

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish (Native AOT, win-x64)
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          dotnet publish src/AiKeepAwake.Console -c Release -r win-x64 -o publish -p:Version=$v
          dotnet publish src/AiKeepAwake.Background -c Release -r win-x64 -o publish -p:Version=$v
          dotnet publish src/AiKeepAwake.Tray -c Release -r win-x64 -o publish -p:Version=$v
          & ./publish/ai-keep-awake.exe --version

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "ai-keep-awake-${{ steps.version.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Path dist, "stage/$name" | Out-Null
          $exes = 'ai-keep-awake.exe', 'ai-keep-awake-background.exe', 'ai-keep-awake-tray.exe' | ForEach-Object { "publish/$_" }
          Copy-Item ($exes + 'README.md') "stage/$name/"
          Compress-Archive -Path "stage/$name/*" -DestinationPath "dist/$name.zip"
          Copy-Item $exes dist/
          # LF line endings, so `sha256sum -c` works as well as Get-FileHash
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($sums -join "`n") + "`n"))
          Get-Content dist/SHA256SUMS.txt
          "zip=dist/$name.zip" >> $env:GITHUB_OUTPUT

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ai-keep-awake/dist/*.zip
            ai-keep-awake/dist/*.exe

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--generate-notes', '--title', "ai-keep-awake ${{ steps.version.outputs.version }}")
          if ('${{ steps.version.outputs.prerelease }}' -eq 'True') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' dist/*.zip dist/*.exe dist/SHA256SUMS.txt @flags
